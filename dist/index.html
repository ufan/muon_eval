<!doctype html>
<html lang="zh-CN">

  <title>周宁下库大坝 缪子部署交互评估</title>
  <meta name="description" content="无需专业软件的坝体缪子探测器三维部署与快速性能边界评估工具">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23071018'/%3E%3Cpath d='M5 23L10 10h12l5 13H5z' fill='%2321d4c2'/%3E%3Cpath d='M16 5v22M11 8l10 16M21 8L11 24' stroke='white' stroke-width='1.5' opacity='.8'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;--bg:#071018;--panel:#0c1721;--line:#203341;--text:#e6f0f4;--muted:#8fa6b4;--cyan:#21d4c2;--blue:#4ca6ff;--green:#38d996;--orange:#ff9d45;--pink:#ff4fb3;--yellow:#ffd84c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,"Microsoft YaHei",sans-serif;overflow:hidden}button,input,select{font:inherit;color:inherit}.app{height:100vh;display:grid;grid-template-columns:300px 1fr 330px;grid-template-rows:54px 1fr}.top{grid-column:1/4;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:#09141d}.brand{font-weight:700;font-size:16px}.tag{color:var(--cyan);border:1px solid #1b615d;border-radius:999px;padding:3px 8px;font-size:12px}.top .spacer{flex:1}.status{color:var(--muted);font-size:13px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}.left,.right{background:var(--panel);overflow:auto}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.section{padding:16px;border-bottom:1px solid var(--line)}.section h2{font-size:13px;letter-spacing:.08em;color:#bad0da;margin:0 0 12px;text-transform:uppercase}.view{position:relative;min-width:0;min-height:0;background:radial-gradient(circle at 52% 43%,#132632 0,#09141d 52%,#060d13 100%)}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;left:16px;top:16px;background:#071018cc;border:1px solid #2b4352;border-radius:9px;padding:10px 12px;color:var(--muted);pointer-events:none}.hud strong{color:var(--text)}.legend{position:absolute;left:16px;bottom:16px;display:flex;gap:10px;flex-wrap:wrap;max-width:70%;background:#071018c9;border:1px solid #203744;border-radius:8px;padding:9px}.key{display:flex;align-items:center;gap:5px;color:#acc0ca;font-size:12px}.sw{width:10px;height:10px;border-radius:2px}.toolbar{position:absolute;right:16px;top:16px;display:flex;gap:7px}.btn{border:1px solid #2b4352;background:#10212c;border-radius:7px;padding:8px 10px;cursor:pointer}.btn:hover{border-color:#478098;background:#15303f}.btn.primary{background:#0e5c57;border-color:#1b8e85}.layers label,.check{display:flex;align-items:center;gap:9px;margin:9px 0;color:#c7d7de;cursor:pointer}.layers input,.check input{accent-color:var(--cyan)}.candidate{padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer}.candidate.active{border-color:var(--pink);background:#32152a}.candidate .name{font-weight:650}.candidate .coord{font-size:12px;color:var(--muted);margin-top:3px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin:9px 0}.field label{display:flex;justify-content:space-between;color:#b9cad2;margin-bottom:5px}.field output{color:var(--cyan);font-variant-numeric:tabular-nums}.field input[type=range]{width:100%;accent-color:var(--cyan)}select,.num{width:100%;border:1px solid #2a414f;background:#0a141c;border-radius:7px;padding:8px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#0a141c;border:1px solid #1f3441;border-radius:8px;padding:10px}.metric b{display:block;font-size:20px;font-weight:650;color:#f1f7f9}.metric span{color:var(--muted);font-size:12px}.score{display:flex;align-items:center;gap:12px}.ring{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--cyan) 0 72%,#18303c 72%);position:relative}.ring:after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--panel)}.ring b{z-index:1;font-size:20px}.note{color:var(--muted);font-size:12px;margin-top:8px}.warning{color:#ffd38a;background:#2a2112;border:1px solid #58401a;border-radius:7px;padding:9px;margin-top:10px}.footer-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.empty{color:var(--muted)}
    @media(max-width:1050px){.app{grid-template-columns:250px 1fr}.right{position:absolute;right:0;top:54px;bottom:0;width:310px;z-index:4;box-shadow:-20px 0 40px #0008}.view{grid-column:2}.left{font-size:13px}}
    @media(max-width:720px){body{overflow:auto}.app{height:auto;min-height:100vh;display:block}.top{position:sticky;top:0;height:54px;z-index:8}.status,.tag{display:none}.view{height:58vh}.left,.right{border:0}.right{position:static;width:auto;box-shadow:none}.legend{max-width:calc(100% - 32px)}.hud{display:none}}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand">周宁下库大坝 · 缪子部署评估</div><div class="tag">方案级模型</div><div class="spacer"></div><div class="status"><span class="dot"></span>本地计算 · 数据不上传</div></header>
  <aside class="left">
    <section class="section"><h2>视图模式</h2><div class="grid2"><button class="btn primary" id="iso">透视</button><button class="btn" id="front">下游立面</button><button class="btn" id="cross">横剖面</button><button class="btn" id="resetView">适配全景</button></div></section>
    <section class="section layers"><h2>模型图层</h2>
      <label><input type="checkbox" data-layer="dam" checked>坝体混凝土外包</label><label><input type="checkbox" data-layer="upper" checked>上层廊道</label><label><input type="checkbox" data-layer="lower" checked>下层廊道</label><label><input type="checkbox" data-layer="shaft" checked>电梯井与观测室</label><label><input type="checkbox" data-layer="spill" checked>溢流孔与底孔</label><label><input type="checkbox" data-layer="platform" checked>出口平台</label><label><input type="checkbox" data-layer="cone" checked>探测器视锥</label>
    </section>
    <section class="section"><h2>候选部署方案</h2><div id="candidateList"></div><button class="btn" id="add" style="width:100%">＋ 新建候选点</button></section>
    <section class="section"><h2>评估条件</h2><div class="field"><label>混凝土密度 <output id="densityO">2.40 t/m³</output></label><input id="density" type="range" min="2.2" max="2.6" step=".01" value="2.4"></div><div class="field"><label>有效面积 <output id="areaO">1.00 m²</output></label><input id="area" type="range" min=".2" max="4" step=".1" value="1"></div><div class="field"><label>观测时长 <output id="daysO">30 天</output></label><input id="days" type="range" min="1" max="180" step="1" value="30"></div></section>
  </aside>
  <main class="view"><canvas id="c"></canvas><div class="hud"><strong>拖动</strong>旋转　<strong>滚轮</strong>缩放　<strong>Shift+拖动</strong>平移<br><span id="hover">指向结构查看坐标</span></div><div class="toolbar"><button class="btn" id="togglePanel">参数面板</button></div><div class="legend"><span class="key"><i class="sw" style="background:#918f87"></i>混凝土</span><span class="key"><i class="sw" style="background:#4ca6ff"></i>上层廊道</span><span class="key"><i class="sw" style="background:#38d996"></i>下层廊道</span><span class="key"><i class="sw" style="background:#a379ff"></i>电梯井</span><span class="key"><i class="sw" style="background:#ff9d45"></i>泄洪结构</span><span class="key"><i class="sw" style="background:#ff4fb3"></i>探测器</span></div></main>
  <aside class="right" id="panel">
    <section class="section"><h2>当前探测器</h2><div class="field"><label>名称</label><input class="num" id="name"></div><div class="grid2"><div class="field"><label>X / m</label><input class="num" id="x" type="number" step=".5"></div><div class="field"><label>Y / m</label><input class="num" id="y" type="number" step=".5"></div><div class="field"><label>Z / m</label><input class="num" id="z" type="number" step=".5"></div><div class="field"><label>布置环境</label><select id="site"><option>坝内廊道</option><option>观测室</option><option>出口平台</option></select></div></div><div class="field"><label>方位角 <output id="azO"></output></label><input id="az" type="range" min="0" max="359" value="90"></div><div class="field"><label>仰角 <output id="elO"></output></label><input id="el" type="range" min="-20" max="80" value="25"></div><div class="field"><label>水平视场 <output id="fovO"></output></label><input id="fov" type="range" min="10" max="80" value="45"></div><label class="check"><input id="snap" type="checkbox" checked>吸附到邻近廊道高程</label></section>
    <section class="section"><h2>快速性能边界</h2><div class="score"><div class="ring" id="ring"><b id="score">72</b></div><div><b id="grade">条件可行</b><div class="note">综合几何覆盖、柱密度与预计计数</div></div></div><div class="metrics" style="margin-top:12px"><div class="metric"><b id="path">45 m</b><span>等效混凝土路径</span></div><div class="metric"><b id="opacity">108</b><span>柱密度 m.w.e.</span></div><div class="metric"><b id="count">1.8k</b><span>预计有效计数</span></div><div class="metric"><b id="angle">25°</b><span>中心仰角</span></div></div><div class="warning" id="warn">快速模型仅用于方案间相对比较；正式结论需经精细几何和完整缪子输运校核。</div></section>
    <section class="section"><h2>方案记录</h2><div class="footer-actions"><button class="btn primary" id="save">保存到本机</button><button class="btn" id="export">导出 JSON</button><button class="btn" id="duplicate">复制方案</button><button class="btn" id="remove">删除当前点</button></div><div class="note" id="saved">修改会即时反映在三维视图中。</div></section>
  </aside>
</div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const COLORS={dam:'#8f8d84',upper:'#4ca6ff',lower:'#38d996',shaft:'#a379ff',spill:'#35c7ff',outlet:'#ff9d45',platform:'#d98b54',detector:'#ff4fb3',cone:'#ff4fb3'};
const paths={upper:[[6,12.5,288],[29,12.5,273],[51,12.5,255],[179,12.5,255],[201,12.5,273],[218,12.5,288],[228,12.5,288]],lower:[[55,12.5,237],[65,12.5,237],[84,12.5,220],[107,12.5,202],[124,12.5,202],[152,12.5,224],[168,12.5,237],[177,12.5,237]],connector:[[79,12.5,255],[58,12.5,237]]};
const stations=[[0,288],[6,284],[29,266],[51,242],[65,226],[84,210],[107,198],[124,198],[152,218],[177,241],[201,266],[218,288],[231,292]];
const candidates=[{name:'A 上层观测室',x:122,y:13,z:255.3,az:90,el:25,fov:45,site:'观测室'},{name:'B 上层廊道北段',x:145,y:12.5,z:255.3,az:105,el:30,fov:45,site:'坝内廊道'},{name:'C 下层观测室',x:116,y:13,z:202.3,az:88,el:42,fov:40,site:'观测室'},{name:'D 南出口平台',x:101,y:75,z:253.4,az:230,el:20,fov:55,site:'出口平台'},{name:'E 北出口平台',x:143,y:75,z:253.4,az:220,el:20,fov:55,site:'出口平台'}];
let active=0, layers={dam:1,upper:1,lower:1,shaft:1,spill:1,platform:1,cone:1}, cam={yaw:-.72,pitch:.42,zoom:3.3,panX:0,panY:0}, drag=null;
const canvas=$('#c'),ctx=canvas.getContext('2d');
function box(x0,x1,y0,y1,z0,z1,type){let v=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],f=[[0,1,2,3],[4,7,6,5],[0,4,5,1],[1,5,6,2],[2,6,7,3],[3,7,4,0]];return{v,f,type}}
function damMesh(){let v=[];stations.forEach(([x,b])=>{let yd=9.7+.83*(298-b);v.push([x,0,b],[x,0,306],[x,9.7,306],[x,9.7,298],[x,yd,b])});let f=[],n=stations.length,ed=[[0,1],[1,2],[2,3],[3,4],[4,0]];f.push([0,1,2,3,4]);f.push([n*5-5,n*5-1,n*5-2,n*5-3,n*5-4]);for(let i=0;i<n-1;i++)ed.forEach(([a,b])=>f.push([i*5+a,(i+1)*5+a,(i+1)*5+b,i*5+b]));return{v,f,type:'dam'}}
function scene(){let s=[damMesh(),box(86,158,-4.5,33,298,306,'dam'),box(109,135,33,38,298,306,'dam')];if(layers.shaft)s.push(box(152.7,155.3,11,14,224,306,'shaft'),box(120.8,123.2,11,15,253.5,258,'shaft'));if(layers.spill){[115,129].forEach(x=>s.push(box(x-3.45,x+3.45,-4.5,20,296,305,'spill')));[101,143].forEach(x=>s.push(box(x-1.9,x+1.9,0,103.5,228,234,'outlet')))}if(layers.platform)[101,143].forEach(x=>s.push(box(x-8.5,x+8.5,47,103.5,215,253,'platform')));return s}
function rot(p){let x=p[0]-115.5,y=p[1]-35,z=p[2]-250,cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch),x1=x*cy-y*sy,y1=x*sy+y*cy,z1=z,y2=y1*cp-z1*sp,z2=y1*sp+z1*cp;return[x1,y2,z2]}
function project(p){let [x,y,z]=rot(p),sc=cam.zoom*Math.min(canvas.width/800,canvas.height/520);return[canvas.width/2+cam.panX+x*sc,canvas.height/2+cam.panY-y*sc,z]}
function render(){let d=devicePixelRatio||1,r=canvas.getBoundingClientRect();if(canvas.width!==r.width*d||canvas.height!==r.height*d){canvas.width=r.width*d;canvas.height=r.height*d}ctx.clearRect(0,0,canvas.width,canvas.height);ctx.lineJoin='round';let faces=[];scene().forEach(m=>{if(m.type==='dam'&&!layers.dam)return;m.f.forEach(f=>{let p=f.map(i=>project(m.v[i]));faces.push({p,depth:p.reduce((a,q)=>a+q[2],0)/p.length,type:m.type})})});faces.sort((a,b)=>a.depth-b.depth);faces.forEach(o=>{let col=COLORS[o.type];ctx.beginPath();o.p.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.globalAlpha=o.type==='dam'?.22:.34;ctx.fillStyle=col;ctx.fill();ctx.globalAlpha=.55;ctx.strokeStyle=col;ctx.lineWidth=1;ctx.stroke()});ctx.globalAlpha=1;
  function drawPath(a,type){if(!layers[type])return;ctx.strokeStyle=COLORS[type];ctx.lineWidth=5*(devicePixelRatio||1);ctx.beginPath();a.forEach((p,i)=>{let q=project(p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.stroke()}
  drawPath(paths.upper,'upper');drawPath(paths.lower,'lower');if(layers.lower)drawPath(paths.connector,'lower');drawDetector(candidates[active]);requestAnimationFrame(render)}
function drawDetector(c){let p=project([c.x,c.y,c.z]);ctx.fillStyle=COLORS.detector;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p[0],p[1],7*(devicePixelRatio||1),0,Math.PI*2);ctx.fill();ctx.stroke();if(layers.cone){let az=c.az*Math.PI/180,el=c.el*Math.PI/180,L=90,dir=[Math.cos(el)*Math.cos(az),Math.cos(el)*Math.sin(az),Math.sin(el)],side=c.fov*Math.PI/360;[-1,1].forEach(k=>{let a=az+k*side,e=[Math.cos(el)*Math.cos(a),Math.cos(el)*Math.sin(a),Math.sin(el)],q=project([c.x+e[0]*L,c.y+e[1]*L,c.z+e[2]*L]);ctx.strokeStyle='#ff4fb388';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke()});let q=project([c.x+dir[0]*L,c.y+dir[1]*L,c.z+dir[2]*L]);ctx.strokeStyle=COLORS.detector;ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();ctx.setLineDash([])}}
function renderList(){let host=$('#candidateList');host.innerHTML='';candidates.forEach((c,i)=>{let el=document.createElement('div');el.className='candidate'+(i===active?' active':'');el.innerHTML=`<div class="name">${c.name}</div><div class="coord">x ${c.x.toFixed(1)} · y ${c.y.toFixed(1)} · ▽${c.z.toFixed(1)}</div>`;el.onclick=()=>{active=i;sync();renderList()};host.append(el)})}
function sync(){let c=candidates[active];['name','x','y','z','az','el','fov','site'].forEach(k=>$('#'+k).value=c[k]);$('#azO').textContent=c.az+'°';$('#elO').textContent=c.el+'°';$('#fovO').textContent=c.fov+'°';metrics()}
function metrics(){let c=candidates[active],density=+$('#density').value,area=+$('#area').value,days=+$('#days').value;let az=c.az*Math.PI/180,el=c.el*Math.PI/180,cos=Math.max(.12,Math.cos(el)),base=c.site==='出口平台'?38:c.z<220?78:48,path=Math.max(8,base/cos*(1+.15*Math.abs(Math.sin(az)))),mwe=path*density,atten=Math.exp(-mwe/95),sky=Math.max(.12,Math.sin(Math.max(.1,el))),count=Math.round(8500*atten*area*days/30*sky),coverage=Math.min(1,c.fov/55),score=Math.round(100*Math.min(1,.42*atten/.45+.28*coverage+.3*Math.min(1,count/1800)));$('#path').textContent=path.toFixed(0)+' m';$('#opacity').textContent=mwe.toFixed(0);$('#count').textContent=count>999?(count/1000).toFixed(1)+'k':count;$('#angle').textContent=c.el+'°';$('#score').textContent=score;$('#ring').style.background=`conic-gradient(var(--cyan) 0 ${score}%,#18303c ${score}%)`;$('#grade').textContent=score>=72?'条件可行':score>=48?'需要优化':'风险较高';$('#densityO').textContent=density.toFixed(2)+' t/m³';$('#areaO').textContent=area.toFixed(2)+' m²';$('#daysO').textContent=days+' 天'}
['name','x','y','z','az','el','fov','site'].forEach(k=>$('#'+k).addEventListener('input',e=>{let c=candidates[active];c[k]=['name','site'].includes(k)?e.target.value:+e.target.value;if(k==='z'&&$('#snap').checked){let levels=[202.3,224,237,255.3,273,288];c.z=levels.reduce((a,b)=>Math.abs(b-c.z)<Math.abs(a-c.z)?b:a);$('#z').value=c.z}sync();renderList()}));['density','area','days'].forEach(k=>$('#'+k).oninput=metrics);$$('[data-layer]').forEach(e=>e.onchange=()=>layers[e.dataset.layer]=e.checked);
$('#add').onclick=()=>{let c={...candidates[active],name:'新候选点 '+(candidates.length+1)};candidates.push(c);active=candidates.length-1;sync();renderList()};$('#duplicate').onclick=$('#add').onclick;$('#remove').onclick=()=>{if(candidates.length<2)return;candidates.splice(active,1);active=Math.max(0,active-1);sync();renderList()};$('#save').onclick=()=>{localStorage.setItem('muon-dam-candidates',JSON.stringify(candidates));$('#saved').textContent='已保存到本机浏览器。'};$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({model:'周宁下库大坝方案级模型',coordinates:'x坝轴/y下游/z高程',candidates,conditions:{density:+$('#density').value,area:+$('#area').value,days:+$('#days').value}},null,2)],{type:'application/json'}));a.download='周宁缪子探测器部署方案.json';a.click();URL.revokeObjectURL(a.href)};
$('#iso').onclick=()=>Object.assign(cam,{yaw:-.72,pitch:.42,zoom:3.3,panX:0,panY:0});$('#front').onclick=()=>Object.assign(cam,{yaw:0,pitch:0,zoom:3.1,panX:0,panY:0});$('#cross').onclick=()=>Object.assign(cam,{yaw:-Math.PI/2,pitch:0,zoom:3.5,panX:0,panY:0});$('#resetView').onclick=$('#iso').onclick;$('#togglePanel').onclick=()=>$('#panel').style.display=$('#panel').style.display==='none'?'block':'none';
canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,shift:e.shiftKey};canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{let r=canvas.getBoundingClientRect(),p=[(e.clientX-r.left)*(devicePixelRatio||1),(e.clientY-r.top)*(devicePixelRatio||1)],best=Infinity,hit=null;candidates.forEach(c=>{let q=project([c.x,c.y,c.z]),d=Math.hypot(q[0]-p[0],q[1]-p[1]);if(d<best){best=d;hit=c}});$('#hover').textContent=best<20?`${hit.name} · x ${hit.x.toFixed(1)}, y ${hit.y.toFixed(1)}, ▽${hit.z.toFixed(1)}`:'指向探测器查看坐标';if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;if(drag.shift){cam.panX+=dx*(devicePixelRatio||1);cam.panY+=dy*(devicePixelRatio||1)}else{cam.yaw+=dx*.008;cam.pitch=Math.max(-1.2,Math.min(1.2,cam.pitch-dy*.008))}};canvas.onpointerup=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();cam.zoom=Math.max(1.2,Math.min(9,cam.zoom*Math.exp(-e.deltaY*.001)))},{passive:false};
let stored=localStorage.getItem('muon-dam-candidates');if(stored){try{let a=JSON.parse(stored);if(Array.isArray(a)&&a.length){candidates.splice(0,candidates.length,...a)}}catch{}}renderList();sync();render();
</script></body></html>
