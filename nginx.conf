server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # File names carry no content hash (no build step), so browsers must revalidate:
    # unchanged files cost a 304, updated modules are never served stale. Long-lived
    # caching comes with hashed names from a build step (ADR-004).
    location ~* \.(?:js|css|png|jpg|jpeg|svg|wasm)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:html|json)$ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
