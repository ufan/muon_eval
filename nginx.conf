server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression. A release made by scripts/package-deploy.sh carries ready-made `.gz` copies (gzip -9,
    # scripts/precompress.mjs), which gzip_static sends with no work per request; other files are compressed on
    # the fly. Meshes and terrain are application/octet-stream: the 2.6 MB scene mesh travels as 0.8 MB.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/octet-stream image/svg+xml;

    # nginx drops server-level add_header lines in any location that sets its own, so every location below
    # repeats the security headers next to its Cache-Control.

    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }

    # Dataset release files live in versioned, immutable release directories (ADR-018), so browsers keep them
    # for a year; /datasets/registry.json (one level only) is excluded and stays revalidated below.
    location ~* ^/datasets/[^/]+/[^/]+/.+\.(?:glb|f32|json)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # File names carry no content hash (no build step), so browsers must revalidate: unchanged files cost a 304,
    # updated modules are never served stale. Long-lived caching comes with hashed names from a build step (ADR-004).
    location ~* \.(?:js|css|png|jpg|jpeg|svg|wasm)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location ~* \.(?:html|json)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }
}
